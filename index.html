<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2937" />
  <meta name="description" content="Create construction punchlists with annotated photos, notes, and contacts. Snap a picture, mark it up, assign it, and check it off when done." />
  <title>Punchlist</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Punchlist" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============ APP HEADER ============ -->
  <header class="app-header">
    <div class="header-inner">
      <button class="icon-btn" id="menuBtn" aria-label="Projects menu" title="Projects">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="header-title">
        <h1 id="projectName">Punchlist</h1>
        <span id="projectMeta" class="header-sub"></span>
      </div>
      <button class="icon-btn" id="plansBtn" aria-label="Plans" title="Plans">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3L3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/></svg>
      </button>
      <button class="icon-btn" id="shareBtn" aria-label="Export / send" title="Export / send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>
      </button>
      <button class="icon-btn" id="contactsBtn" aria-label="Directory" title="Directory (contractors & people)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </button>
    </div>
    <!-- Filter / progress bar -->
    <div class="toolbar" id="listToolbar">
      <button class="plans-entry" id="plansEntryBtn" aria-label="View floor plans">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3L3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/></svg>
        <span>Plans</span>
      </button>
      <div class="filters" id="filterChips" role="tablist" aria-label="Filter items">
        <button class="chip active" data-filter="all" role="tab">All</button>
        <button class="chip" data-filter="open" role="tab">Open</button>
        <button class="chip" data-filter="progress" role="tab">In&nbsp;Progress</button>
        <button class="chip" data-filter="done" role="tab">Done</button>
        <button class="chip" data-filter="verified" role="tab">Verified</button>
      </div>
      <div class="progress-wrap" title="Completion">
        <div class="progress-bar"><span id="progressFill"></span></div>
        <span id="progressText" class="progress-text">0/0</span>
      </div>
    </div>
    <!-- Filter by trade / person -->
    <div class="toolbar filterbar" id="filterBar">
      <select class="filter-select" id="filterTrade" aria-label="Filter by trade / contractor"><option value="">All trades</option></select>
      <select class="filter-select" id="filterAssignee" aria-label="Filter by person"><option value="">All people</option></select>
      <button class="chip" id="clearFilters" hidden>Clear</button>
    </div>
  </header>

  <!-- ============ ITEM LIST ============ -->
  <main class="content" id="listView">
    <!-- One-time tip pointing at the Plans button -->
    <div id="planTip" class="plan-tip" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3L3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/></svg>
      <div class="plan-tip-text"><strong>New: Floor plans</strong><br>Tap <b>Plans</b> above to add a floor plan or blueprint and drop task pins on it.</div>
      <button id="planTipClose" class="plan-tip-x" aria-label="Dismiss">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <ul id="itemList" class="item-list"></ul>
    <div id="emptyState" class="empty-state hidden">
      <svg viewBox="0 0 24 24" class="empty-icon" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <h2>No items yet</h2>
      <p>Tap the camera button to snap a photo and add your first item — or tap <b>Plans</b> above to add a floor plan and drop task pins on it.</p>
    </div>
  </main>

  <!-- ============ FLOATING ACTION BUTTONS ============ -->
  <div class="fab-group">
    <button class="fab fab-secondary" id="addNoteBtn" aria-label="Add item without photo" title="Add item without photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="fab fab-primary" id="addPhotoBtn" aria-label="Add item with photo" title="Take / choose photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
  </div>

  <!-- Hidden file input used to capture / pick a photo -->
  <input type="file" id="photoInput" accept="image/*" capture="environment" hidden />
  <!-- Hidden file input for plans (image or PDF) -->
  <input type="file" id="planInput" accept="image/*,application/pdf" hidden />
  <!-- Hidden file input for importing contacts (Excel / CSV) -->
  <input type="file" id="contactsImportInput" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden />

  <!-- ============ PROJECTS DRAWER ============ -->
  <div class="drawer-scrim" id="drawerScrim" hidden></div>
  <aside class="drawer" id="projectsDrawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>Punchlists</h2>
      <button class="icon-btn" id="closeDrawer" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <ul id="projectList" class="project-list"></ul>
    <button class="btn-block" id="newProjectBtn">+ New Punchlist</button>
    <div class="drawer-footer">
      <button class="link-btn" id="exportBtn">Export backup</button>
      <button class="link-btn" id="importBtn">Import backup</button>
      <input type="file" id="importInput" accept="application/json" hidden />
    </div>
  </aside>

  <!-- ============ MODAL ROOT (dialogs injected here) ============ -->
  <div id="modalRoot"></div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <!-- Common trades for the category picker -->
  <datalist id="tradeList">
    <option value="General"></option><option value="Concrete"></option><option value="Framing"></option>
    <option value="Electrical"></option><option value="Plumbing"></option><option value="HVAC"></option>
    <option value="Drywall"></option><option value="Insulation"></option><option value="Paint"></option>
    <option value="Flooring"></option><option value="Tile"></option><option value="Roofing"></option>
    <option value="Windows & Doors"></option><option value="Cabinets"></option><option value="Millwork"></option>
    <option value="Masonry"></option><option value="Landscaping"></option><option value="Cleanup"></option><option value="Punch"></option>
  </datalist>
  <datalist id="areaList">
    <option value="Kitchen"></option><option value="Living Room"></option><option value="Dining Room"></option>
    <option value="Primary Bedroom"></option><option value="Bedroom"></option><option value="Bathroom"></option>
    <option value="Powder Room"></option><option value="Hallway"></option><option value="Closet"></option>
    <option value="Laundry"></option><option value="Garage"></option><option value="Basement"></option>
    <option value="Attic"></option><option value="Stairwell"></option><option value="Lobby"></option>
    <option value="Common Area"></option><option value="Mechanical Room"></option><option value="Roof"></option>
    <option value="Exterior"></option><option value="Site"></option>
  </datalist>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
